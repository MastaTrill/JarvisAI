<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - JarvisAI</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-900 flex items-center justify-center min-h-screen">
    <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold text-white mb-6 text-center">Admin Login</h2>
        {% if error %}
        <div class="bg-red-500 text-white p-2 rounded mb-4">{{ error }}</div>
        {% endif %}
        <form method="post" action="/admin/dashboard/login">
            <div class="mb-4">
                <label class="block text-gray-300 mb-2" for="username">Username</label>
                <input class="w-full px-3 py-2 rounded bg-gray-700 text-white focus:outline-none" type="text"
                    id="username" name="username" required>
            </div>
            <div class="mb-6">
                <label class="block text-gray-300 mb-2" for="password">Password</label>
                <input class="w-full px-3 py-2 rounded bg-gray-700 text-white focus:outline-none" type="password"
                    id="password" name="password" required>
            </div>
            <button class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded"
                type="submit">Login</button>
        </form>
    </div>
</body>

</html>
