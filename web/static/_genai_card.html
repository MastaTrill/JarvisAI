<div class="card">
    <h3>🎨 Generative AI Studio</h3>
    <p>Generate creative text or images using state-of-the-art generative models. Enter a prompt and select the type of
        generation.</p>
    <form id="genaiForm" style="margin-bottom: 1rem;">
        <input type="text" name="prompt" placeholder="Enter prompt"
            style="margin-bottom: 0.5rem; width: 100%; padding: 0.5rem; border-radius: 5px; border: 1px solid #0051ff;">
        <select name="mode"
            style="margin-bottom: 0.5rem; width: 100%; padding: 0.5rem; border-radius: 5px; border: 1px solid #0051ff;">
            <option value="text">Text Generation</option>
            <option value="image">Image Generation</option>
        </select>
        <button class="btn" type="submit">Generate</button>
    </form>
    <div id="genaiResult" class="demo-output" style="display:none;"></div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('genaiForm');
        const resultDiv = document.getElementById('genaiResult');
        if (form) {
            form.onsubmit = async function (e) {
                e.preventDefault();
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = '⏳ Generating...';
                const formData = new FormData(form);
                try {
                    const resp = await fetch('/advanced/genai/generate', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await resp.json();
                    if (formData.get('mode') === 'image' && data.image_url) {
                        resultDiv.innerHTML = `<img src="${data.image_url}" alt="Generated Image" style="max-width:100%;border-radius:10px;"><br><pre>` + JSON.stringify(data, null, 2) + '</pre>';
                    } else {
                        resultDiv.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                    }
                } catch (err) {
                    resultDiv.innerHTML = '❌ Error: ' + err.message;
                }
            };
        }
    });
</script>
