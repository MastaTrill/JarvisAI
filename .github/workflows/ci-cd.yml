name: Jarvis CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade --upgrade-strategy eager -r requirements.txt
          # tflite-runtime has no cp312+ wheels; install openwakeword without that dep
          # and use onnxruntime (already in requirements.txt).
          if python -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 12) else 1)'; then
            pip install --no-deps 'openwakeword>=0.6.0'
          fi
      - name: Lint (fatal errors only)
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run tests with coverage
        run: |
          python -m pytest tests/ --cov --cov-report=xml --cov-report=term --cov-fail-under=60 -q
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit security scan
        run: |
          bandit -r src/ -ll --skip B101

  docker:
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      HAS_DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Docker Hub credentials not configured - skipping push
        if: env.HAS_DOCKER_PASSWORD != 'true'
        run: echo "::notice title=Docker push skipped::DOCKER_PASSWORD secret is not set; skipping Docker Hub login, build and push."
      - name: Build and push Docker image
        if: env.HAS_DOCKER_PASSWORD == 'true'
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "${DOCKER_PASSWORD}" | docker login -u "mastatrill" --password-stdin
          docker build -t "mastatrill/jarvis-ai:latest" .
          docker push "mastatrill/jarvis-ai:latest"

  deploy:
    needs: docker
    # Kubernetes deploy is opt-in: set the repository variable K8S_DEPLOY_ENABLED=true
    # once KUBECONFIG points at a cluster reachable from GitHub-hosted runners.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      K8S_DEPLOY_ENABLED: ${{ vars.K8S_DEPLOY_ENABLED == 'true' && secrets.KUBECONFIG != '' }}
    steps:
      - name: Kubernetes deploy not enabled - skipping
        if: env.K8S_DEPLOY_ENABLED != 'true'
        run: echo "::notice title=Kubernetes deploy skipped::Set repo variable K8S_DEPLOY_ENABLED=true (and a KUBECONFIG secret for a cluster reachable from GitHub runners) to enable Helm deploys."
      - uses: actions/checkout@v4
        if: env.K8S_DEPLOY_ENABLED == 'true'
      - name: Deploy to Kubernetes (Helm)
        if: env.K8S_DEPLOY_ENABLED == 'true'
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
        run: |
          echo "$KUBECONFIG" > kubeconfig
          export KUBECONFIG=$(pwd)/kubeconfig
          helm upgrade --install jarvis-ai ./helm --set image.repository="mastatrill/jarvis-ai" --set image.tag=latest
